name: refresh-private-dns-screenshot-goldens

on:
  push:
    branches: ["fix/private-dns-screenshot-goldens"]

permissions:
  contents: write

concurrency:
  group: screenshot-goldens
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Record updated screenshot baselines
        run: ./gradlew :feature:manage:recordRoborazziDebug --console=plain

      - name: Commit refreshed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/manage/src/test/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot baselines changed."
            exit 0
          fi
          git commit -m "test(manage): refresh TV settings screenshot baselines"
          git push
